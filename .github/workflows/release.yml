name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            artifact: lifx-maestro-macos
            archive: lifx-maestro-macos.zip
          - name: linux
            os: ubuntu-latest
            artifact: lifx-maestro-linux
            archive: lifx-maestro-linux.tar.gz
          - name: windows
            os: windows-latest
            artifact: lifx-maestro-windows
            archive: lifx-maestro-windows.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyzer/requirements.txt

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # Freeze the Python analyzer so released builds analyze audio without a
      # Python install. The result replaces the committed placeholder archive
      # that internal/analyzerbin embeds.
      - name: Install analyzer build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r analyzer/requirements.txt pyinstaller

      - name: Freeze analyzer
        run: |
          pyinstaller --noconfirm --clean --onedir --name analyze \
            --distpath analyzer-dist --workpath analyzer-build --specpath analyzer-build \
            --collect-all librosa \
            --collect-all lazy_loader \
            --collect-all soxr \
            --collect-all soundfile \
            --collect-all audioread \
            --collect-all numba \
            --collect-all llvmlite \
            --collect-submodules sklearn \
            analyzer/analyze.py
        shell: bash

      # A frozen bundle can build cleanly and still fail at import time, so run
      # it once against generated audio before shipping it.
      - name: Smoke test frozen analyzer
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np, soundfile as sf
          sr = 22050
          t = np.linspace(0, 3, sr * 3, endpoint=False)
          tone = 0.2 * np.sin(2 * np.pi * 220 * t)
          sf.write("analyzer-build/smoke.wav", tone, sr)
          PY

          if [ "${{ runner.os }}" = "Windows" ]; then
            ANALYZE="$PWD/analyzer-dist/analyze/analyze.exe"
          else
            ANALYZE="$PWD/analyzer-dist/analyze/analyze"
          fi
          SMOKE="$PWD/analyzer-build/smoke.wav"

          "$ANALYZE" "$SMOKE" | python -c 'import json,sys; json.load(sys.stdin)'

          # Also run from the filesystem root. An app launched from Finder inherits
          # "/" as its working directory, and a CI-built analyzer has been seen to
          # segfault there inside numpy while working from every other directory.
          # The app no longer inherits that directory, but a bundle that dies in it
          # is not one to ship.
          if [ "${{ runner.os }}" != "Windows" ]; then
            (cd / && "$ANALYZE" "$SMOKE") | python -c 'import json,sys; json.load(sys.stdin)'
          fi

      - name: Bundle analyzer for embedding
        if: runner.os != 'Windows'
        run: |
          rm -f internal/analyzerbin/assets/analyzer.zip
          # -y preserves the symlinks PyInstaller creates inside Python.framework.
          (cd analyzer-dist && zip -qry ../internal/analyzerbin/assets/analyzer.zip analyze)

      - name: Bundle analyzer for embedding (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Force internal\analyzerbin\assets\analyzer.zip
          Compress-Archive -Path analyzer-dist\analyze -DestinationPath internal\analyzerbin\assets\analyzer.zip

      # Guard against shipping the 22-byte placeholder, which would silently
      # fall back to requiring a local Python install.
      - name: Verify analyzer is bundled
        shell: bash
        run: |
          size=$(wc -c < internal/analyzerbin/assets/analyzer.zip)
          echo "analyzer.zip is $size bytes"
          if [ "$size" -lt 1048576 ]; then
            echo "::error::analyzer bundle looks like the placeholder; refusing to release"
            exit 1
          fi

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build app
        shell: bash
        run: |
          # The version shows in the window title, so a screenshot identifies the build.
          wails build ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }} \
            -ldflags "-X main.version=${GITHUB_REF_NAME#v}"

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/lifx-maestro.app \
            release/${{ matrix.archive }}

      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -czf release/${{ matrix.archive }} -C build/bin .

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path build/bin/* -DestinationPath release/${{ matrix.archive }}

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
